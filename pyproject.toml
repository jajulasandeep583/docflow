[project]
name = "docflow"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
description = "A mobile-friendly PWA frontend for Frappe DocTypes"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Frappe is provided by the bench, so it is intentionally not pinned here.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "docflow"
